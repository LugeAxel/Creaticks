<style>
        /* Camera viewfinder animations */
        @keyframes scan-line {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(150%); }
        }
        .animate-scan-line {
            animation: scan-line 2s linear infinite;
        }
        
        @keyframes pulse-corner {
            0%, 100% { border-color: #22c55e; }
            50% { border-color: rgba(34, 197, 94, 0.4); }
        }
        .animate-pulse-corner {
            animation: pulse-corner 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-gray-900 text-on-primary h-screen flex flex-col font-sans overflow-hidden antialiased">
<!-- Simulated Camera Feed Background -->
<div class="fixed inset-0 z-0 bg-gray-900">
<img alt="Festival Background" class="w-full h-full object-cover opacity-30 grayscale-[50%]" data-alt="A blurred background showing a lively music festival entrance at night. Crowds of people are moving towards glowing neon ticket gates. The scene is slightly out of focus to simulate a camera viewfinder looking for a QR code. Dark, moody lighting with vibrant accents of blue and pink stage lights in the distance. The style is modern, energetic, and slightly noisy, fitting a youthful event checking application in a dark mode setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDwFB6lX23OgMGyVt1r71HCata8yWc1xDdry4Ziiy2WQdiqMs4Y499H4nZa6ZZMnOTZbYC2fOegiufN_FJmXqtEHkrJrH5iqAEmE4NqWRscfo4WBuf9R1WecrvqaMPWkQX-LkrXRqIEbrU41hudJVZueCJMdRJ258NIyuJgCTbSKT6D8bRzl4EwCiCSkrEij-J_MkvgK7oGhzgm18cflJGZoPtV_-XKnNr3H8K4yTjznKrgoej_aaUm_KcT_f1c3NvV47csUufvO8g"/>
<div class="absolute inset-0 bg-black/60"></div>
</div>
<!-- Top Navigation (Dark Mode Exception) -->
<header class="relative z-10 flex justify-between items-center w-full px-margin-mobile h-16 bg-transparent">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 backdrop-blur-md text-white hover:bg-white/20 transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="text-center">
<h1 class="text-label-md font-label-md text-white/70">Scanner QR</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 backdrop-blur-md text-white hover:bg-white/20 transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined" data-icon="flash_on">flash_on</span>
</button>
</header>
<!-- Main Content Area -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4">
<!-- Context Header -->
<div class="mb-8 text-center">
<h2 class="text-headline-md font-headline-md text-white mb-2">Bandung Music Fest</h2>
<p class="text-body-md font-body-md text-white/80">Scan tiket untuk check-in</p>
</div>
<!-- Viewfinder -->
<div class="relative w-64 h-64 md:w-80 md:h-80 mb-12">
<!-- Cutout / Focus Area -->
<div class="absolute inset-0 bg-black/20 backdrop-blur-[2px] rounded-2xl border border-white/20 shadow-[0_0_40px_rgba(0,0,0,0.5)]"></div>
<!-- Scanning Line Animation -->
<div class="absolute top-0 left-0 w-full h-1 bg-green-500 shadow-[0_0_10px_#22c55e] animate-scan-line rounded-full z-20"></div>
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 rounded-tl-xl animate-pulse-corner z-10"></div>
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 rounded-tr-xl animate-pulse-corner z-10"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 rounded-bl-xl animate-pulse-corner z-10"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 rounded-br-xl animate-pulse-corner z-10"></div>
</div>
<!-- Manual Entry Link -->
<button class="text-label-md font-label-md text-white/70 hover:text-white underline underline-offset-4 transition-colors px-4 py-2 rounded-lg hover:bg-white/5 active:scale-95">
            Masukkan ID Tiket Manual
        </button>
</main>
<!-- Success Overlay Mock (Hidden by default, shown for demonstration) -->
<!-- Add class 'hidden' to the parent div below to hide it in a real scenario until triggered -->
<div class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/80 backdrop-blur-sm transition-opacity duration-300">
<div class="bg-surface-container-lowest rounded-2xl p-6 w-full max-w-sm shadow-[0px_10px_32px_rgba(0,0,0,0.08)] flex flex-col items-center text-center transform scale-100 transition-transform duration-300">

</div>
<h3 class="text-headline-sm font-headline-sm text-on-surface mb-2">Siti Aminah</h3>
<div class="flex items-center gap-2 mb-4">
<span class="px-3 py-1 bg-primary/10 text-primary text-label-md font-label-md rounded-full">VIP</span>
</div>
<p class="text-body-md font-body-md text-on-surface-variant mb-8">Sudah Check-in!</p>
<button class="w-full py-3 bg-primary text-on-primary text-label-md font-label-md rounded-full shadow-md hover:bg-primary/90 transition-colors active:scale-95">
                Scan Tiket Berikutnya
